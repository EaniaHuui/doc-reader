<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ document.title if document else 'Share unavailable' }} - Doc Reader</title>

    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=34">
</head>
<body class="share-page">
    <main class="share-shell">
        {% if error %}
            <section class="share-error">
                <h1>分享不可用</h1>
                <p>{{ error }}</p>
            </section>
        {% else %}
            <article class="document share-document">
                <h1 class="document-title share-title">{{ document.title }}</h1>
                <div class="document-time">
                    最后更新：{{ document.modified }}
                    {% if expires_at %}
                    <span class="share-expires">分享有效期至：{{ expires_at }}</span>
                    {% endif %}
                </div>
                <div class="document-content share-content">
                    {{ document.content | safe }}
                </div>
            </article>
        {% endif %}
    </main>
    <script src="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
        });
    </script>
</body>
</html>
