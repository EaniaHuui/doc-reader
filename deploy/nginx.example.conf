# Doc Reader — nginx reverse proxy example
#
# 用法（示例）:
#   1. ./start.sh --prod          # gunicorn 监听 127.0.0.1:5000
#   2. 复制本文件到 /etc/nginx/sites-available/doc-reader
#   3. 修改 server_name / SSL 路径后:
#        ln -s /etc/nginx/sites-available/doc-reader /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#
# 说明:
#   - 静态资源可继续由 Flask/gunicorn 提供（简单）
#   - 若要把 static 交给 nginx，取消下方 # STATIC 段落注释，并设置 root

upstream doc_reader {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name docs.example.com;

    # 可选：强制 HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 20m;

    # 安全头（按需调整）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 访问与错误日志
    access_log /var/log/nginx/doc-reader.access.log;
    error_log  /var/log/nginx/doc-reader.error.log;

    # ---- STATIC（可选）：直接由 nginx 提供 static/ ----
    # location /static/ {
    #     alias /home/zhuhui/project/markdown-reader/static/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }

    location / {
        proxy_pass http://doc_reader;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 若上游只绑 127.0.0.1，保持默认即可
    }
}

